[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-audio-transformer-plugin-speechbrain-langdetect"
dynamic = ["version"]
description = "A speech lang detection plugin for mycroft"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["ovos", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torchaudio>=2.1.0",
    "speechbrain>=1.0.3",
    "ovos-plugin-manager>=2.1.1,<3.0.0",
    "ovos-utils>=0.8.4,<1.0.0",
    "ovos-config>=0.0.12",
    "huggingface_hub==1.30.0"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-audio-transformer-plugin-speechbrain-langdetect"

[project.entry-points."opm.transformer.audio"]
"ovos-audio-transformer-plugin-speechbrain-langdetect" = "ovos_audio_transformer_plugin_speechbrain_langdetect:SpeechBrainLangClassifier"

[tool.setuptools.dynamic]
version = {attr = "ovos_audio_transformer_plugin_speechbrain_langdetect.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_audio_transformer_plugin_speechbrain_langdetect*"]
