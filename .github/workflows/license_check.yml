name: License Check

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  license_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    secrets: inherit
    with:
      # Transitive torch dependencies with unparseable license metadata, tagged
      # Other/Error by pilosus — all permissive false positives:
      #   nvidia-*/cuda-* : proprietary but redistributable CUDA runtime wheels
      #   sentencepiece   : Apache-2.0 (Google), ships empty license metadata
      exclude_packages: >-
        (?i:^nvidia-[a-z0-9-]*([=<>!~ @;].*)?$)|(?i:^cuda-[a-z0-9-]*([=<>!~ @;].*)?$)|(?i:^sentencepiece([=<>!~ @;].*)?$)
